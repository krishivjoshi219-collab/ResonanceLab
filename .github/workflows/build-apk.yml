name: Build Debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.11.1 (no wrapper needed)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --warning-mode all

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ResonanceLab-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
